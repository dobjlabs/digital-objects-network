name: Clippy Check

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, opened, synchronize, reopened]
    # Runs unless every changed file is one the root Cargo workspace never
    # reads; a path not listed here runs it. UI-only PRs are tested by gui.yml.
    # Pushes to main run it regardless.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!deploy/**"
      - "!utils/**"
      - "!devtools/models/**"
      - "!libs/driver/model/**"
      - "!interfaces/gui/**"
      - "!examples/bitcraft/presentation/**"
      - "!apps/bitcraft/*.md"
      - "!apps/bitcraft/scripts/**"
      - "!apps/bitcraft/shell/**"
      - "!apps/bitcraft/skills/**"
      - "!apps/bitcraft/src-tauri/**"
      - "!apps/bitcraft/tests/**"
      - "!apps/bitcraft/ui/**"
      - "!.github/**"
      - ".github/workflows/clippy.yml"
  push:
    branches: [main]

jobs:
  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-shared-key: clippy
          cache-workspace-crates: true
      - name: Check lints with clippy
        run: cargo clippy --release --locked
