name: Clippy Check

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, opened, synchronize, reopened]
    # UI-only PRs are tested by gui.yml; pushes to main still run this.
    paths-ignore:
      - "interfaces/gui/**"
      - "apps/bitcraft/ui/**"
      - "apps/bitcraft/tests/**"
  push:
    branches: [main]

jobs:
  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-shared-key: clippy
          cache-workspace-crates: true
      - name: Check lints with clippy
        run: cargo clippy --release --locked
