name: Rust Tests

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, opened, synchronize, reopened]
    # Runs unless every changed file is one the root Cargo workspace never
    # reads; a path not listed here runs it. UI-only PRs are tested by gui.yml.
    # Pushes to main run it regardless.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!deploy/**"
      - "!utils/**"
      - "!devtools/models/**"
      - "!libs/driver/model/**"
      - "!interfaces/gui/**"
      - "!examples/bitcraft/presentation/**"
      - "!apps/bitcraft/*.md"
      - "!apps/bitcraft/scripts/**"
      - "!apps/bitcraft/shell/**"
      - "!apps/bitcraft/skills/**"
      - "!apps/bitcraft/src-tauri/**"
      - "!apps/bitcraft/tests/**"
      - "!apps/bitcraft/ui/**"
      - "!.github/**"
      - ".github/workflows/rust_tests.yml"
  push:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: interfaces/gui/pnpm-lock.yaml
      - name: Build default browser UI
        working-directory: interfaces/gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: tests-release
          cache-workspace-crates: true
      - name: Run tests
        run: cargo test --release --locked --features dobjd/bundled-ui,dobjd/bundled-bitcraft-ui
