name: Rust Tests

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: interfaces/gui/pnpm-lock.yaml
      - name: Build default browser UI
        working-directory: interfaces/gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-25
          cache-shared-key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          cache-workspace-crates: true
      - name: Run tests
        run: cargo test --release --locked --features dobjd/bundled-ui
