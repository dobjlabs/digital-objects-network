[workspace]
members = [
    "services/dobjd",
    "services/synchronizer",
    "services/relayer",
    "services/archiver",
    "interfaces/cli",
    "interfaces/gui/src-tauri",
    "interfaces/mcp",
    "libs/driver",
    "libs/sdk",
    "libs/txlib",
    "libs/payload",
    "libs/wire-types",
    "libs/pod2utils",
    "libs/pexe",
    "libs/eth-clients",
    "libs/intro-pods/vdfpod",
    "libs/intro-pods/lt-eq-u256-pod",
]
resolver = "2"

[workspace.dependencies]
pod2 = { git = "https://github.com/0xPARC/pod2", rev = "7a3f2c132cca851fcbef52a738cc026a5b6c58ca", default-features = false, features = [
    "backend_plonky2",
    "disk_cache",
    "zk",
] }
plonky2 = { git = "https://github.com/0xPARC/plonky2.git", rev = "109d517d09c210ae4c2cee381d3e3fbc04aa3812" }
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.143"
alloy = { version = "1.2.1", features = [
    "eips",
    "full",
    "json-rpc",
    "hyper",            #
    "transport-http",
    "signer-local",
    "rpc-client",
    "rpc-types-beacon",
] }
alloy-primitives = "1.5.7"

# common
anyhow = "1.0.56"
itertools = "0.14.0"
dotenvy = "0.15.7"
hex = "0.4.3"
toml = "1.1.2"

# logging
env_logger = { version = "0.11" }
log = { version = "0.4.14", features = ["kv_unstable"] }
tracing = "0.1.19"
tracing-subscriber = { version = "0.3", features = [
    "registry",
    "env-filter",
    "fmt",
    "time",
] }
tracing-log = "0.1.1"
time = { version = "0.3.44", features = ["formatting", "local-offset"] }
rand = { version = "0.9.2", features = ["std_rng"] }
thiserror = "2.0.18"
wire-types = { path = "libs/wire-types" }

[patch."https://github.com/0xPARC/pod2"]
pod2 = { path = "../pod2" }

# Uncomment in order to enable debug information in the release builds.  This allows getting panic backtraces with a performance similar to regular release.
[profile.release]
debug = true
