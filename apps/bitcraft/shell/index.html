<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <main>
      <img class="logo" src="bitcraft-logo.png" alt="" width="128" height="128">
      <h1 id="status" role="status" aria-live="polite">Preparing artifacts...</h1>
      <!-- A sliver of the first step, so the bar reads as a progress bar
           before any step is done. -->
      <progress class="startup-progress" max="4" value="0.2" aria-label="Startup progress" aria-valuetext="Step 1 of 4: Preparing artifacts" aria-describedby="status"></progress>
    </main>
  </div>
  <!-- Static stand-in for the game page's status bar: services cannot be
       read or probed until the daemon is ready. -->
  <footer class="status-bar">
    <span class="status-item"><span class="status-label">Bitcraft version:</span> Alpha 1.0</span>
    <span class="status-item"><span class="status-label">Synchronizer status:</span> <span class="status-dot loading"></span>Loading...</span>
    <span class="status-item"><span class="status-label">Synchronizer address:</span> Loading...</span>
    <span class="status-item"><span class="status-label">Relayer status:</span> <span class="status-dot loading"></span>Loading...</span>
    <span class="status-item"><span class="status-label">Relayer address:</span> Loading...</span>
  </footer>
</body>
</html>
