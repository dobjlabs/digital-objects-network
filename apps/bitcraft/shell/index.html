<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="brand">Bitcraft</p>
    <progress class="startup-progress" max="3" value="0" aria-label="Startup progress" aria-describedby="startup-progress-label status"></progress>
    <p id="startup-progress-label">Step 1 of 3</p>
    <h1 id="status" role="status" aria-live="polite">Preparing cryptography...</h1>
    <p class="description">On first launch, Bitcraft prepares the cryptography used to certify your items. This can take several minutes.</p>
  </main>
</body>
</html>
