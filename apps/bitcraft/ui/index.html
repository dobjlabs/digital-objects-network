<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcraft Inventory</title>
<style>
  :root {
    --bg: #ffffff;
    --pane-header-bg: #f5f5f5;
    --border: #d4d4d4;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --row-hover: #f0f0f0;
    --row-selected: #cce4ff;
    --error: #b00020;
    --link: #0b57d0;
    --action-name: #6d28d9;
    --run-in-progress: #a16207;
    --run-failed: #b00020;
    --object-unknown: #9a9a9a;
    --object-pending: #a16207;
    --object-held: #9a9a9a;
    --row-flash: #ffe58a;
    --menu-bg: rgba(246, 246, 246, 0.94);
    --menu-border: rgba(0, 0, 0, 0.14);
    --menu-highlight: #0a64d8;
    --menu-disabled: #a8a8a8;
    --menu-divider: rgba(0, 0, 0, 0.12);
    --tab-track: #e3e3e3;
    --status-connected: #16a34a;
    --status-disconnected: #dc2626;
    --status-unknown: #a8a8a8;
    /* Blank strip kept below the last row of a full list, so a click on
       empty space to clear the selection always has a target. */
    --list-trailing-space: 48px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #inventory-app {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }
  #inventory-app[hidden], #startup-screen[hidden] { display: none; }
  #startup-screen {
    display: grid;
    flex: 1;
    place-items: center;
    padding: 32px;
    background: #fafafa;
  }
  .startup-content { width: min(100%, 380px); }
  .startup-brand { margin: 0 0 32px; font-size: 16px; font-weight: 600; }
  #startup-status { margin: 20px 0 10px; font-size: 24px; font-weight: 600; line-height: 1.25; }
  #startup-description { color: var(--muted); font-size: 14px; line-height: 1.6; }
  #startup-error {
    color: var(--error);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    user-select: text;
    -webkit-user-select: text;
  }
  #startup-copy-status { color: var(--muted); }
  .startup-progress {
    display: block;
    width: 100%;
    height: 6px;
    appearance: none;
    border: 0;
    border-radius: 3px;
    overflow: hidden;
    background: #dedede;
    color: #6d28d9;
  }
  .startup-progress::-webkit-progress-bar { background: #dedede; }
  .startup-progress::-webkit-progress-value { background: #6d28d9; }
  .startup-progress::-moz-progress-bar { background: #6d28d9; }
  #startup-progress-label { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  #startup-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  #startup-actions[hidden] { display: none; }
  #startup-actions button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  #startup-actions #startup-retry { background: #6d28d9; border-color: #6d28d9; color: white; }
  #status-bar {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 20px;
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    background: var(--pane-header-bg);
    font-size: 12px;
  }
  .status-label { color: var(--muted); }
  .status-item { white-space: nowrap; }
  /* A one-line count under the object list, like Finder's item count. */
  .list-footer {
    flex: none;
    padding: 3px 10px;
    border-top: 1px solid var(--border);
    background: var(--pane-header-bg);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 5px 1px 0;
    border-radius: 50%;
    vertical-align: middle;
    background: var(--status-unknown);
  }
  .status-dot.connected { background: var(--status-connected); }
  .status-dot.disconnected { background: var(--status-disconnected); }
  #tab-bar {
    flex: none;
    display: flex;
    justify-content: center;
    padding: 6px 10px;
    background: var(--pane-header-bg);
    border-bottom: 1px solid var(--border);
  }
  .tab-track {
    display: inline-flex;
    padding: 2px;
    border-radius: 7px;
    background: var(--tab-track);
  }
  .tab {
    padding: 2px 18px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: default;
  }
  .tab[aria-selected="true"] {
    background: var(--bg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
  }
  /* Each tab's view; both stay in the page so their state survives
     switching tabs. */
  .view {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  .view[hidden] { display: none; }
  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
  }
  #left-column {
    display: flex;
    flex-direction: column;
    width: 40%;
    min-width: 280px;
    height: 100%;
    border-right: 1px solid var(--border);
  }
  /* The jobs pane takes a third of the column, the object list the rest. */
  #objects-pane {
    flex: 2;
    min-height: 0;
  }
  #execute-pane {
    flex: 1;
    min-height: 0;
    border-top: 1px solid var(--border);
  }
  #execute-pane[hidden] { display: none; }
  #run-list {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 0 0 var(--list-trailing-space);
    list-style: none;
  }
  .run-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    cursor: default;
    user-select: none;
    white-space: nowrap;
  }
  .run-icon-slot {
    flex: none;
    width: 16px;
    height: 16px;
  }
  .run-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* A job's text, its action name included, takes its status color; a
     succeeded job keeps the normal colors. */
  .run-row.in-progress .run-text,
  .run-row.in-progress .run-text * { color: var(--run-in-progress); }
  .run-row.failed .run-text,
  .run-row.failed .run-text * { color: var(--run-failed); }
  .run-row:hover { background: var(--row-hover); }
  .run-row.selected { background: var(--row-selected); }
  .action-name,
  .details-title.action-name {
    color: var(--action-name);
    font-weight: 500;
  }
  .row-text {
    flex: 1;
    min-width: 0;
  }
  .action-source {
    margin: 6px 0 0;
    padding: 8px;
    background: var(--pane-header-bg);
    border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
  }
  .subsection-list { margin-top: 4px; }
  .path-line {
    display: flex;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .path-label {
    flex: none;
    color: var(--muted);
  }
  .field-table.run-log td {
    padding: 2px 12px 2px 0;
    vertical-align: top;
    font-family: inherit;
    word-break: normal;
  }
  .field-table.run-log td:nth-child(-n + 4) {
    white-space: nowrap;
    color: var(--muted);
  }
  .sub-subsection-title {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .action-detail {
    font-size: 11px;
    color: var(--muted);
  }
  #details-pane,
  #recipe-details-pane {
    flex: 1;
  }
  .pane-header {
    flex: none;
    padding: 6px 10px;
    background: var(--pane-header-bg);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #object-list {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 0 0 var(--list-trailing-space);
    list-style: none;
  }
  .object-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    cursor: default;
    user-select: none;
    white-space: nowrap;
  }
  .object-row:hover { background: var(--row-hover); }
  .object-row.selected { background: var(--row-selected); }
  .object-row.unknown { color: var(--object-unknown); }
  .object-row.pending { color: var(--object-pending); }
  .object-row.held { color: var(--object-held); }
  @keyframes row-flash {
    from { background: var(--row-flash); }
  }
  .object-row svg { flex: none; }
  .icon-tile {
    flex: none;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.28);
  }
  .class-label { white-space: nowrap; }
  .class-label > .icon-tile,
  .class-label > svg {
    display: inline-block;
    vertical-align: middle;
    margin: -2px 5px 0 0;
  }
  .action-icon {
    position: relative;
    flex: none;
  }
  .action-icon > img {
    position: absolute;
    image-rendering: pixelated;
  }
  .action-icon-tile {
    position: absolute;
    background: var(--bg);
  }
  .action-icon > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .icon-tile img {
    display: block;
    width: 16px;
    height: 16px;
    image-rendering: pixelated;
  }
  .object-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .message {
    padding: 8px 10px;
    color: var(--muted);
  }
  .message.error { color: var(--error); }
  #details-body,
  #recipe-details-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
  }
  .details-icon {
    display: flex;
    justify-content: center;
    padding: 16px 0 20px;
  }
  .icon-stack { position: relative; }
  .large-page-icon { position: relative; }
  .large-page-icon svg { display: block; }
  /* The 16px art at 6x, centered across the page and placed just below the
     folded corner, lower than the page's vertical center. */
  .large-class-icon {
    position: absolute;
    left: 16px;
    top: 40px;
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
  }
  .icon-stack svg { position: absolute; }
  .details-title {
    font-size: 16px;
    font-weight: 600;
    word-break: break-all;
  }
  .details-meta {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }
  .details-meta a { color: var(--link); }
  .field-table {
    margin-top: 12px;
    border-collapse: collapse;
    width: 100%;
  }
  /* One label width for every labelled table, so values line up across
     tables whatever their contents. */
  .field-table:not(.run-log) { table-layout: fixed; }
  .field-table th {
    width: 9em;
    text-align: left;
    font-weight: normal;
    color: var(--muted);
    padding: 2px 12px 2px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: top;
  }
  .field-table td {
    padding: 2px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .hidden-value { cursor: pointer; }
  .subsection-title {
    margin-top: 16px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .collapsible-section > summary {
    cursor: default;
    user-select: none;
  }
  .markdown-body {
    max-width: 46em;
    line-height: 1.5;
  }
  .markdown-body h1 {
    margin: 4px 0 8px;
    font-size: 20px;
  }
  .markdown-body h2 {
    margin: 20px 0 6px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  .markdown-body h3 {
    margin: 14px 0 4px;
    font-size: 13px;
  }
  .markdown-body p,
  .markdown-body ul,
  .markdown-body ol { margin: 6px 0; }
  .markdown-body ul,
  .markdown-body ol { padding-left: 22px; }
  .markdown-body code {
    padding: 0 3px;
    border-radius: 3px;
    background: var(--pane-header-bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  .markdown-body table {
    margin: 8px 0;
    border-collapse: collapse;
  }
  .markdown-body th,
  .markdown-body td {
    padding: 3px 8px;
    border: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  .markdown-body th {
    background: var(--pane-header-bg);
    font-weight: 600;
  }
  .context-menu {
    position: fixed;
    z-index: 10;
    min-width: 180px;
    max-height: calc(100vh - 8px);
    overflow-y: auto;
    padding: 5px;
    background: var(--menu-bg);
    border: 1px solid var(--menu-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), 0 1px 3px rgba(0, 0, 0, 0.12);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    cursor: default;
    user-select: none;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    /* Wider on the right so labels that follow an icon do not look pushed
       against the menu's edge. */
    padding: 0 19px 0 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .menu-item.highlighted {
    background: var(--menu-highlight);
    color: #fff;
  }
  .menu-item.disabled { color: var(--menu-disabled); }
  .menu-item.highlighted .action-name,
  .menu-item.disabled .action-name { color: inherit; }
  .menu-item-label { flex: 1; }
  .menu-item-icon {
    flex: none;
    width: 16px;
    height: 16px;
  }
  .menu-divider {
    height: 1px;
    margin: 5px 8px;
    background: var(--menu-divider);
  }
  #recipe-pane {
    width: 40%;
    min-width: 280px;
    border-right: 1px solid var(--border);
  }
  #recipe-list {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 0 0 var(--list-trailing-space);
    list-style: none;
  }
  .recipe-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border-bottom: 1px solid var(--row-hover);
    cursor: default;
    user-select: none;
  }
  .recipe-row:hover { background: var(--row-hover); }
  .recipe-row.selected { background: var(--row-selected); }
  .recipe-icon-slot {
    flex: none;
    width: 32px;
    height: 32px;
  }
  .recipe-path {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    /* Puts the ellipsis at the start so the file name stays visible. */
    direction: rtl;
    text-align: left;
  }
</style>
</head>
<body>
  <section id="startup-screen" aria-labelledby="startup-status">
    <div class="startup-content">
      <p class="startup-brand">Bitcraft</p>
      <progress id="startup-progress" class="startup-progress" max="3" value="0" aria-label="Startup progress" aria-describedby="startup-progress-label startup-status"></progress>
      <p id="startup-progress-label">Step 1 of 3</p>
      <div role="status" aria-live="polite" aria-atomic="true">
        <h1 id="startup-status">Opening Bitcraft...</h1>
        <p id="startup-description">Getting your inventory ready.</p>
      </div>
      <p id="startup-error" role="alert" hidden></p>
      <div id="startup-actions" hidden>
        <button type="button" id="startup-retry">Try again</button>
        <button type="button" id="startup-copy">Copy error</button>
      </div>
      <p id="startup-copy-status" role="status" hidden></p>
    </div>
  </section>
  <div id="inventory-app" hidden inert>
  <nav id="tab-bar">
    <div class="tab-track" role="tablist">
      <button type="button" class="tab" role="tab" id="objects-tab" aria-controls="objects-view">Objects</button>
      <button type="button" class="tab" role="tab" id="recipebook-tab" aria-controls="recipebook-view">Recipe Info</button>
    </div>
  </nav>
  <div id="objects-view" class="view" role="tabpanel" aria-labelledby="objects-tab">
    <div id="left-column">
      <section id="objects-pane" class="pane">
        <div id="objects-dir" class="pane-header">&nbsp;</div>
        <ul id="object-list"></ul>
        <div id="objects-footer" class="list-footer">&nbsp;</div>
      </section>
      <section id="execute-pane" class="pane">
        <div class="pane-header">Active and completed jobs</div>
        <ul id="run-list"></ul>
      </section>
    </div>
    <section id="details-pane" class="pane">
      <div class="pane-header">Details</div>
      <div id="details-body"></div>
    </section>
  </div>
  <div id="recipebook-view" class="view" role="tabpanel" aria-labelledby="recipebook-tab" hidden>
    <section id="recipe-pane" class="pane">
      <div class="pane-header">Recipe Info</div>
      <ul id="recipe-list"></ul>
    </section>
    <section id="recipe-details-pane" class="pane">
      <div class="pane-header">Details</div>
      <div id="recipe-details-body"></div>
    </section>
  </div>
  </div>
  <footer id="status-bar">
    <span class="status-item"><span class="status-label">Bitcraft version:</span> <span id="bitcraft-version"></span></span>
    <span class="status-item"><span class="status-label">Synchronizer status:</span> <span id="synchronizer-dot" class="status-dot"></span><span id="synchronizer-status">Checking</span></span>
    <span class="status-item"><span class="status-label">Synchronizer address:</span> <span id="synchronizer-address">n/a</span></span>
    <span class="status-item"><span class="status-label">Relayer status:</span> <span id="relayer-dot" class="status-dot"></span><span id="relayer-status">Checking</span></span>
    <span class="status-item"><span class="status-label">Relayer address:</span> <span id="relayer-address">n/a</span></span>
  </footer>

<template id="file-icon">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M3.5 1.5h6l3 3v10h-9z" fill="#fff" stroke="#8a8a8a"/>
    <path d="M9.5 1.5v3h3" fill="none" stroke="#8a8a8a"/>
  </svg>
</template>

<!-- Action icon badges, drawn on the 32x32 action icon grid in its
     top-right corner, with a white outline so they read over any art. -->
<template id="badge-plus">
  <svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">
    <path d="M24 0h5v3h3v5h-3v3h-5v-3h-3v-5h3z" fill="#fff"/>
    <path d="M25 1h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="#16a34a"/>
  </svg>
</template>

<template id="badge-up">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M22.5 8.5l4-4 4 4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.5 8.5l4-4 4 4" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</template>

<template id="badge-down">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M22.5 4.5l4 4 4-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.5 4.5l4 4 4-4" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</template>

<template id="doc-icon">
  <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
    <defs>
      <filter id="doc-icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0.75" stdDeviation="0.75" flood-color="#000" flood-opacity="0.25"/>
      </filter>
    </defs>
    <path d="M8 2.5h11.5l7 7V27.5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-23a2 2 0 0 1 2-2z" fill="#fff" stroke="#d2d2d2" filter="url(#doc-icon-shadow)"/>
    <path d="M19.5 2.5v5a2 2 0 0 0 2 2h5" fill="#ececec" stroke="#d2d2d2" stroke-linejoin="round"/>
    <path d="M10 14h12M10 17.5h12M10 21h12M10 24.5h8" stroke="#b4b4b4" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</template>

<template id="large-file-icon">
  <svg width="128" height="160" viewBox="0 0 128 160" aria-hidden="true">
    <defs>
      <filter id="large-file-icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18"/>
      </filter>
    </defs>
    <path d="M6 4h80l36 36v114H6z" fill="#fff" stroke="#d0d0d0" filter="url(#large-file-icon-shadow)"/>
    <path d="M86 4v28a8 8 0 0 0 8 8h28" fill="#f2f2f2" stroke="#d0d0d0"/>
  </svg>
</template>

<script>
  const DOBJD_URL = new URL(
    document.querySelector('meta[name="dobjd-api-url"]')?.content || "http://127.0.0.1:7717",
    window.location.href,
  ).href.replace(/\/$/, "");

  // ---- Bitcraft-specific rules. Every entry here is listed in
  // BITCRAFT_SPECIFIC_RULES.md; keep the two in step.

  const PLUGIN_NAME = "bitcraft";

  const STARTUP_RUN_STORAGE_KEY = "bitcraft.startup-pocketknife-run";
  let startupPocketknifeActive = false;
  let startupPocketknifeRun = null;
  let startupPocketknifeTimer = null;

  function isPocketknife(className) {
    return className.pluginName === PLUGIN_NAME && className.name === "Pocketknife";
  }

  function rememberStartupRun(runId) {
    try {
      sessionStorage.setItem(STARTUP_RUN_STORAGE_KEY, runId);
    } catch {}
  }

  function hideRestoredStartupRun() {
    let runId;
    try {
      runId = sessionStorage.getItem(STARTUP_RUN_STORAGE_KEY);
    } catch {
      return;
    }
    const run = runs.find((candidate) => candidate.runId === runId);
    if (run) run.showInJobs = false;
  }

  function stopStartupPocketknife() {
    startupPocketknifeActive = false;
    clearInterval(startupPocketknifeTimer);
    startupPocketknifeTimer = null;
  }

  function updateStartupPocketknife(run = startupPocketknifeRun) {
    if (!startupPocketknifeActive) return;
    startupPocketknifeRun = run;
    if ([...objectsByFileName.values()].some((object) => isPocketknife(object.class) && isLive(object))) {
      setStartupProgress(3);
      stopStartupPocketknife();
      finishStartup();
      return;
    }
    if (run?.state?.status === "committing" || run?.state?.status === "succeeded"
      || run?.state?.progress?.some((event) => event.phase === "generateProof" && event.status === "done")
      || [...objectsByFileName.values()].some((object) => isPocketknife(object.class))) {
      setStartupProgress(2);
    }
    if (run?.requestError || run?.state?.status === "failed") {
      showStartupError(run.requestError ?? run.state.error ?? "Pocketknife creation failed.");
      return;
    }
    if (run?.transportError) {
      showStartupError(startupErrorText(run.transportError, "Could not check progress: "));
      return;
    }
    if (run?.state?.status === "committing" || run?.state?.status === "succeeded") {
      showStartup("Waiting for confirmation...", "Your pocketknife is being confirmed by the network. This can take a little while.");
    } else {
      showStartup("Creating your first pocketknife...", "Bitcraft is making a cryptographic proof for your starter tool. You will be ready to gather resources soon.");
    }
  }

  // A request that got no HTTP response at all means the local daemon is
  // not running, not a transient fault, so the text says how to recover.
  function startupErrorText(error, httpErrorPrefix = "") {
    if (!error.noResponse) return `${httpErrorPrefix}${error.message}`;
    const dobjHome = objectsDirPath.match(/^(.+)[\\/]objects[\\/]?$/)?.[1];
    return `Bitcraft's background service isn't responding (${error.message}). `
      + "Quit and reopen Bitcraft to restart it."
      + (dobjHome ? ` Its log is dobjd.log in ${dobjHome}.` : "");
  }

  async function discardObjectUnsafe(fileName) {
    try {
      await postJson(`/objects/${encodeURIComponent(fileName)}/discard_unsafe`, {});
    } catch (error) {
      if (error.status !== 404) throw new Error(`Could not discard ${fileName}: ${error.message}`);
    }
  }

  async function ensureStartupPocketknife() {
    stopStartupPocketknife();
    startupPocketknifeRun = null;
    hideRestoredStartupRun();
    renderRuns();
    const objects = await fetchJson("/objects/unspent");
    showObjects(objects);
    if (objects.some((object) => isPocketknife(object.class) && isLive(object))) {
      setStartupProgress(3);
      finishStartup();
      return;
    }
    startupPocketknifeActive = true;
    const activeRun = runs.find((run) => isRunInProgress(run) && (
      run.action.action.name === "CraftPocketknife"
      || run.action.totalOutputs?.some((output) => isPocketknife(output.class))
    ));
    if (activeRun) {
      activeRun.onUpdate = updateStartupPocketknife;
      updateStartupPocketknife(activeRun);
    } else {
      // No run is left to finish these. The object listing reports local
      // state when it cannot reach the synchronizer, so reaching it here is
      // what shows the listing really found them off chain.
      const staleKnives = objects.filter((object) => isPocketknife(object.class));
      if (staleKnives.length > 0) {
        try {
          await fetchJson("/state-root");
        } catch (error) {
          throw new Error(`Could not check your pocketknife on the network: ${error.message}`);
        }
      }
      for (const knife of staleKnives) {
        await discardObjectUnsafe(knife.fileName);
      }
      if (staleKnives.length > 0) {
        showObjects(objects.filter((object) => !staleKnives.includes(object)));
      }
      const action = pluginActions.find((candidate) => candidate.action.name === "CraftPocketknife");
      if (!action) throw new Error("The starter pocketknife recipe is unavailable. Check that the Bitcraft plugin is installed.");
      await startRun(action, [], {
        showInJobs: false,
        onUpdate(run) {
          if (run.runId) rememberStartupRun(run.runId);
          updateStartupPocketknife(run);
        },
      });
    }
    if (startupPocketknifeActive) {
      startupPocketknifeTimer = setInterval(() => {
        if (!startupPocketknifeRun || !isRunInProgress(startupPocketknifeRun) || startupPocketknifeRun.transportError) {
          return reloadObjects();
        }
      }, 1500);
    }
  }

  // Constraints an action places on its inputs beyond their classes, which
  // the HTTP API does not report. An action whose name matches `actions` is
  // offered only when `accepts` returns true for the selected objects; the
  // regex match is passed along so a rule can read values out of the name.
  const ACTION_INPUT_RULES = [
    {
      actions: /^UseQuarry(\d+)$/,
      accepts: (inputs, match) => inputFieldEquals(inputs, "Quarry", "level", match[1]),
    },
    {
      actions: /^UseMiningDrill(\d+)$/,
      accepts: (inputs, match) => inputFieldEquals(inputs, "MiningDrill", "level", match[1]),
    },
    {
      actions: /^(BucketOf(?:Wood|Stone|Iron))Take1$/,
      accepts: (inputs, match) => inputFieldAtLeast(inputs, match[1], "n", 1),
    },
  ];

  // Maps each class name to its icon's path relative to this page, or to
  // null for a class with no icon.
  const CLASS_ICONS_URL = "class-icons.json";
  let classIconPaths = {};

  // Ordered rules for each action's 32x32 graphic; the first rule whose
  // `actions` pattern matches the action name applies.
  const ACTION_ICONS_URL = "action-icons.json";
  let actionIconRules = [];

  // A getting-started guide shown as the first row of the object list: its
  // file name, which is also its URL relative to this page. It is served
  // next to this page, not read from the objects folder.
  const WELCOME_FILE = "BITCRAFT_WELCOME.md";

  // Shown in the status bar at the bottom of the page.
  const BITCRAFT_VERSION = "Alpha 1.0";

  // Total Bit Value: what an object is worth in bits, counting each raw
  // resource spent to make it at the rate its BitsFrom* recipe pays (Wood 1,
  // Stone 2, Iron 5). Worked out by hand from the recipes, per class.
  const TOTAL_BIT_VALUES = {
    Bit: 1,
    Wood: 1,
    Stone: 2,
    Iron: 5,
    Pocketknife: 0,
    Stick: 0.5,
    WoodAxe: 2,
    StoneAxe: 4,
    IronAxe: 9,
    BucketOfWood: 5,
    BucketOfStone: 5,
    BucketOfIron: 5,
  };
  // A bucket is also worth the `n` resources it holds, at these rates.
  const BUCKET_CONTENT_BIT_VALUES = { BucketOfWood: 1, BucketOfStone: 2, BucketOfIron: 5 };
  // Quarries and drills by level (index 0 is level 1): building one, plus the
  // full buckets every level-up spends.
  const LEVELED_TOTAL_BIT_VALUES = {
    Quarry: [40, 130, 300, 630, 1280, 2570],
    MiningDrill: [135, 420, 975, 2070, 4245, 8580],
  };

  // ---- End of bitcraft-specific rules.

  const objectsDirHeader = document.getElementById("objects-dir");
  const objectList = document.getElementById("object-list");
  const fileIconTemplate = document.getElementById("file-icon");
  const actionBadgeTemplates = {
    plus: document.getElementById("badge-plus"),
    up: document.getElementById("badge-up"),
    down: document.getElementById("badge-down"),
  };
  const largeFileIconTemplate = document.getElementById("large-file-icon");
  const detailsBody = document.getElementById("details-body");
  const runList = document.getElementById("run-list");
  const docIconTemplate = document.getElementById("doc-icon");

  // The address names the open tab and the recipebook's selected action, so
  // `?page=recipebook&action=bitcraft::GatherWood` links to that action.
  // Read once here: the address is rewritten as the page's state changes.
  const PAGE_PARAM = "page";
  const RECIPEBOOK_PAGE = "recipebook";
  const RECIPE_ACTION_PARAM = "action";
  const initialParams = new URLSearchParams(location.search);
  const views = {
    objects: {
      tab: document.getElementById("objects-tab"),
      view: document.getElementById("objects-view"),
      title: "Bitcraft Inventory",
    },
    recipebook: {
      tab: document.getElementById("recipebook-tab"),
      view: document.getElementById("recipebook-view"),
      title: "Bitcraft Recipe Info",
    },
  };
  let currentViewName = "objects";
  const recipeList = document.getElementById("recipe-list");
  const recipeDetailsBody = document.getElementById("recipe-details-body");
  let recipeActions = [];
  let selectedRecipeName = null;
  const recipeRowsByName = new Map();

  const NOT_AVAILABLE = "n/a";
  const objectsFooter = document.getElementById("objects-footer");
  // Unspent objects in the objects folder, pending ones included, whatever
  // their plugin; null until the first load.
  let objectFileCount = null;
  const SERVICE_STATUS_INTERVAL_MS = 10000;
  const SERVICE_PROBE_TIMEOUT_MS = 3000;
  const MAX_STACKED_ICONS = 3;
  const HIDDEN_KEY_TEXT = "\u2022".repeat(16) + " (click to reveal)";
  const NON_PROPERTY_KEYS = new Set(["stable_identifier", "type", "key"]);

  const selectedFileNames = new Set();
  const objectsByFileName = new Map();
  // The state each file was last shown in; null until the first load.
  let lastShownStates = null;
  // When each row's current flash began: a file appearing for the first
  // time, or a file's shown state changing.
  const flashStartedAt = new Map();
  const ROW_FLASH_MS = 1500;
  let objectReloadInFlight = false;
  let objectReloadQueued = false;
  let pluginActions = [];
  let objectsDirPath = "";
  // Runs started from this page, newest first. A selected run is always the
  // only selection: selecting one clears the object selection.
  let runs = [];
  let nextRunClientId = 1;
  let selectedRunId = null;
  const rowsByFileName = new Map();
  const IS_MAC = /Mac/.test(navigator.platform);
  // The boundary a shift-click selects from, and the selection as it stood
  // when that boundary was set. A shift-click replaces any range selected by
  // an earlier shift-click from the same anchor.
  let anchorFileName = null;
  let selectionAtAnchor = new Set();
  // The open context menu's element; null when closed.
  let openMenu = null;
  // The objects the open context menu acts on, as selected when it opened.
  let menuFileNames = [];
  const MENU_DIVIDER = "divider";
  // The guide's Markdown and its size in bytes; null when it could not be
  // loaded, and then it is not listed.
  let welcomeText = null;
  let welcomeFileSize = null;

  function fieldEntries(object) {
    const kvs = object.fields && object.fields.kvs;
    return Array.isArray(kvs) ? kvs : [];
  }

  // A pod2 value serializes as a single-entry object tagged with its type.
  function displayValue(value) {
    if (value !== null && typeof value === "object" && !Array.isArray(value)) {
      const tags = Object.keys(value);
      if (tags.length === 1 && typeof value[tags[0]] !== "object") {
        return String(value[tags[0]]);
      }
    }
    return typeof value === "string" ? value : JSON.stringify(value);
  }

  function inputFieldEquals(inputs, className, fieldName, expected) {
    const input = inputs.find((object) => object.class.name === className);
    return input !== undefined && fieldValue(input, fieldName) === expected;
  }

  function inputFieldAtLeast(inputs, className, fieldName, minimum) {
    const input = inputs.find((object) => object.class.name === className);
    return input !== undefined && Number(fieldValue(input, fieldName)) >= minimum;
  }

  function passesActionInputRules(action, inputs) {
    return ACTION_INPUT_RULES.every((rule) => {
      const match = rule.actions.exec(action.action.name);
      return match === null || rule.accepts(inputs, match);
    });
  }

  function fieldValue(object, name) {
    const entry = fieldEntries(object).find(([key]) => key === name);
    return entry ? displayValue(entry[1]) : null;
  }

  function rawObjectUrl(fileName) {
    return `${DOBJD_URL}/objects/${encodeURIComponent(fileName)}/raw`;
  }

  function formatFileSize(bytes) {
    if (typeof bytes !== "number") {
      return NOT_AVAILABLE;
    }
    if (bytes < 1024) {
      return `${bytes} B`;
    }
    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function appendFieldRow(table, label, value) {
    const row = table.insertRow();
    const header = document.createElement("th");
    header.textContent = label;
    header.title = label;
    row.append(header);
    const cell = row.insertCell();
    cell.textContent = value ?? NOT_AVAILABLE;
    return cell;
  }

  // A class's art on a rounded tile, or the plain page icon for a class
  // without art.
  function smallClassIcon(className) {
    const classIconPath = classIconPaths[className];
    if (!classIconPath) {
      return fileIconTemplate.content.cloneNode(true).querySelector("svg");
    }
    const tile = document.createElement("span");
    tile.className = "icon-tile";
    const classIcon = document.createElement("img");
    classIcon.src = classIconPath;
    classIcon.alt = "";
    tile.append(classIcon);
    return tile;
  }

  // What the first matching rule draws for an action, with `$1`-style
  // references in its class names filled from the pattern's match; null
  // when no rule matches.
  function actionIconSpec(actionName) {
    for (const rule of actionIconRules) {
      const match = new RegExp(rule.actions).exec(actionName);
      if (match === null) {
        continue;
      }
      const fill = (template) =>
        template?.replace(/\$(\d)/g, (_, group) => match[Number(group)] ?? "") ?? null;
      return {
        icon: fill(rule.icon),
        image: rule.image ?? null,
        badge: rule.badge ?? null,
        cornerIcon: fill(rule.cornerIcon),
      };
    }
    return null;
  }

  // The action's graphic, laid out on a 32x32 grid and drawn `scale` CSS px
  // per grid unit: an app-style rounded tile with the art centered on it.
  // Null when no rule matches or it names neither an image nor a class
  // with art.
  function actionIcon(actionName, scale) {
    const spec = actionIconSpec(actionName);
    const iconPath = spec && (spec.image ?? classIconPaths[spec.icon]);
    if (!iconPath) {
      return null;
    }
    const icon = document.createElement("div");
    icon.className = "action-icon";
    icon.style.width = `${32 * scale}px`;
    icon.style.height = `${32 * scale}px`;
    // The tile spans grid units 2-30, with macOS's ~22% corner radius.
    const tile = document.createElement("div");
    tile.className = "action-icon-tile";
    tile.style.left = `${2 * scale}px`;
    tile.style.top = `${2 * scale}px`;
    tile.style.width = `${28 * scale}px`;
    tile.style.height = `${28 * scale}px`;
    tile.style.borderRadius = `${6.25 * scale}px`;
    tile.style.boxShadow = [
      `inset 0 0 0 ${0.25 * scale}px rgba(0, 0, 0, 0.08)`,
      `0 ${0.5 * scale}px ${scale}px rgba(0, 0, 0, 0.3)`,
    ].join(", ");
    icon.append(tile);
    const layer = (path, gridX, gridY, gridSize) => {
      const image = document.createElement("img");
      image.src = path;
      image.alt = "";
      image.style.left = `${gridX * scale}px`;
      image.style.top = `${gridY * scale}px`;
      image.style.width = `${gridSize * scale}px`;
      image.style.height = `${gridSize * scale}px`;
      return image;
    };
    icon.append(layer(iconPath, 8, 8, 16));
    const cornerPath = spec.cornerIcon && classIconPaths[spec.cornerIcon];
    if (cornerPath) {
      icon.append(layer(cornerPath, 20, 20, 8));
    }
    const badgeTemplate = actionBadgeTemplates[spec.badge];
    if (badgeTemplate) {
      icon.append(badgeTemplate.content.cloneNode(true).querySelector("svg"));
    }
    return icon;
  }

  // A class's qualified name with its small icon to the left.
  function classLabel(qualifiedName) {
    const label = document.createElement("span");
    label.className = "class-label";
    label.append(smallClassIcon(qualifiedName.name), qualifiedClassName(qualifiedName));
    return label;
  }

  function summaryLine(object, leadingParts) {
    return fileSummaryLine(object.fileName, [
      ...leadingParts,
      object.class ? classLabel(object.class) : NOT_AVAILABLE,
      formatFileSize(object.fileSize),
      object.status ?? NOT_AVAILABLE,
    ]);
  }

  function welcomeSummaryLine(leadingParts) {
    const label = document.createElement("span");
    label.className = "class-label";
    label.append(docIconTemplate.content.cloneNode(true), WELCOME_FILE);
    return fileSummaryLine(WELCOME_FILE, [
      ...leadingParts,
      label,
      formatFileSize(welcomeFileSize),
    ]);
  }

  // The parts, then a link to the file's contents.
  function fileSummaryLine(fileName, parts) {
    const line = document.createElement("div");
    line.className = "details-meta";
    for (const part of parts) {
      line.append(part, " \u00b7 ");
    }
    const rawLink = document.createElement("a");
    rawLink.href = fileUrl(fileName);
    rawLink.target = "_blank";
    rawLink.rel = "noopener";
    rawLink.textContent = "View raw";
    line.append(rawLink);
    return line;
  }

  function stackedFileIcons(count) {
    const iconWidth = 128;
    const iconHeight = 160;
    const offset = 12;
    const stack = document.createElement("div");
    stack.className = "icon-stack";
    stack.style.width = `${iconWidth + offset * (count - 1)}px`;
    stack.style.height = `${iconHeight + offset * (count - 1)}px`;
    // Earlier icons sit further back, up and to the right.
    for (let depth = count - 1; depth >= 0; depth--) {
      const fragment = largeFileIconTemplate.content.cloneNode(true);
      const svg = fragment.querySelector("svg");
      svg.style.left = `${offset * depth}px`;
      svg.style.top = `${offset * (count - 1 - depth)}px`;
      stack.append(svg);
    }
    return stack;
  }

  function renderMultipleDetails() {
    const icon = document.createElement("div");
    icon.className = "details-icon";
    icon.append(stackedFileIcons(Math.min(selectedFileNames.size, MAX_STACKED_ICONS)));

    const fileCount = selectedFileNames.has(WELCOME_FILE) ? 1 : 0;
    const objectCount = selectedFileNames.size - fileCount;
    const counted = (count, noun) => `${count} ${noun}${count === 1 ? "" : "s"}`;
    const title = document.createElement("div");
    title.className = "details-title";
    title.textContent = fileCount === 0
      ? counted(objectCount, "object")
      : `${counted(objectCount, "object")} and ${counted(fileCount, "file")}`;

    detailsBody.append(icon, title);
    let index = 1;
    for (const fileName of selectedFileNames) {
      const prefix = [`#${index}`];
      detailsBody.append(
        fileName === WELCOME_FILE
          ? welcomeSummaryLine(prefix)
          : summaryLine(objectsByFileName.get(fileName), prefix),
      );
      index++;
    }
  }

  function qualifiedClassName(qualifiedName) {
    return `${qualifiedName.pluginName}::${qualifiedName.name}`;
  }

  // Order-independent key for a multiset of class names.
  function classMultisetKey(classNames) {
    return [...classNames].sort().join("\n");
  }

  // The plugin's actions whose inputs the given objects fill exactly.
  function availableActions(fileNames) {
    const objects = fileNames.map((fileName) => objectsByFileName.get(fileName));
    const objectsKey = classMultisetKey(objects.map((object) => qualifiedClassName(object.class)));
    return pluginActions.filter((action) => {
      const inputKey = classMultisetKey(
        action.totalInputs.map((input) => qualifiedClassName(input.class)),
      );
      return inputKey === objectsKey && passesActionInputRules(action, objects);
    });
  }

  // Opens the context menu for the current object selection, which may be
  // empty: then it offers the actions that take no inputs. Clicking an
  // action executes it on the selection.
  function showObjectMenu(x, y) {
    const fileNames = [...selectedFileNames];
    const entries = [];
    if (fileNames.length > 0) {
      entries.push({
        label: fileNames.length === 1 ? "Open" : "Open all",
        onSelect: () => {
          for (const fileName of fileNames) {
            window.open(fileUrl(fileName), "_blank", "noopener");
          }
        },
      });
    }
    // A file that is not an object is no action's input.
    if (fileNames.includes(WELCOME_FILE)) {
      openContextMenu(entries, x, y);
      menuFileNames = fileNames;
      return;
    }
    if (fileNames.length > 0) {
      entries.push(MENU_DIVIDER);
    }
    const actions = availableActions(fileNames);
    if (actions.length === 0) {
      entries.push({ label: "No available actions", isDisabled: () => true });
    }
    for (const action of actions) {
      entries.push({
        label: qualifiedClassName(action.action),
        labelClass: "action-name",
        icon: actionIcon(action.action.name, 0.5),
        isDisabled: () => runs.some(isRunInProgress),
        onSelect: () => startRun(action, fileNames),
      });
    }
    openContextMenu(entries, x, y);
    menuFileNames = fileNames;
  }

  // Each entry is MENU_DIVIDER or an item: `label` and `onSelect`, and
  // optionally `labelClass`, `icon` (an element, or null to keep the icon
  // column empty) and `isDisabled`.
  function openContextMenu(entries, x, y) {
    closeContextMenu();
    openMenu = createMenu(entries);
    document.body.append(openMenu);
    placeMenu(openMenu, x, y);
  }

  function closeContextMenu() {
    openMenu?.remove();
    openMenu = null;
    menuFileNames = [];
  }

  function createMenu(entries) {
    const element = document.createElement("div");
    element.className = "context-menu";
    element.setAttribute("role", "menu");
    element.addEventListener("contextmenu", (event) => event.preventDefault());
    for (const entry of entries) {
      if (entry === MENU_DIVIDER) {
        const divider = document.createElement("div");
        divider.className = "menu-divider";
        element.append(divider);
        continue;
      }
      const item = document.createElement("div");
      item.className = "menu-item";
      item.setAttribute("role", "menuitem");
      item.isDisabled = entry.isDisabled ?? null;
      if (entry.icon !== undefined) {
        const iconSlot = document.createElement("span");
        iconSlot.className = "menu-item-icon";
        if (entry.icon) {
          iconSlot.append(entry.icon);
        }
        item.append(iconSlot);
      }
      const label = document.createElement("span");
      label.className = "menu-item-label";
      if (entry.labelClass) {
        label.classList.add(entry.labelClass);
      }
      label.textContent = entry.label;
      item.append(label);
      item.addEventListener("mouseenter", () => {
        if (!item.classList.contains("disabled")) {
          item.classList.add("highlighted");
        }
      });
      item.addEventListener("mouseleave", () => item.classList.remove("highlighted"));
      item.addEventListener("click", () => {
        if (item.classList.contains("disabled")) {
          return;
        }
        closeContextMenu();
        entry.onSelect();
      });
      element.append(item);
    }
    refreshMenuItems(element);
    return element;
  }

  // Puts the menu's top-left corner at (x, y), or its top-right corner there
  // when it would run off the right of the window, and keeps it inside the
  // window.
  function placeMenu(element, x, y) {
    const margin = 4;
    const { width, height } = element.getBoundingClientRect();
    let left = x + width > window.innerWidth - margin ? x - width : x;
    left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
    const top = Math.max(margin, Math.min(y, window.innerHeight - height - margin));
    element.style.left = `${left}px`;
    element.style.top = `${top}px`;
  }

  // Re-reads each item's `isDisabled`, e.g. when a run starts or finishes
  // while the menu is open.
  function refreshMenuItems(menuElement) {
    for (const item of menuElement.querySelectorAll(".menu-item")) {
      if (item.isDisabled === null) {
        continue;
      }
      const disabled = item.isDisabled();
      item.classList.toggle("disabled", disabled);
      item.setAttribute("aria-disabled", String(disabled));
      if (disabled) {
        item.classList.remove("highlighted");
      }
    }
  }

  function refreshOpenMenus() {
    if (openMenu !== null) {
      refreshMenuItems(openMenu);
    }
  }

  function isRunInProgress(run) {
    if (run.requestError !== null) {
      return false;
    }
    const status = run.state?.status;
    return status !== "succeeded" && status !== "failed";
  }

  function newRun(action, inputFileNames) {
    return {
      id: nextRunClientId++,
      action,
      inputFileNames,
      runId: null,
      state: null,
      requestError: null,
      transportError: null,
      eventSource: null,
      showInJobs: true,
      onUpdate: null,
      clientStartedAt: Date.now(),
      clientEndedAt: null,
      elapsedElement: null,
      finishedAgoElement: null,
      detailsElapsedElement: null,
      latestEventDurationElement: null,
      // The status the row last showed (undefined until first drawn), and
      // when the row's current flash began.
      shownStatus: undefined,
      flashStartedAt: null,
    };
  }

  async function startRun(action, fileNames, { showInJobs = true, onUpdate = null } = {}) {
    const inputFileNames = assignInputSlots(action, fileNames).map((object) => object.fileName);
    const run = newRun(action, inputFileNames);
    run.showInJobs = showInJobs;
    run.onUpdate = onUpdate;
    runs.unshift(run);
    showSelection();
    run.onUpdate?.(run);

    try {
      const accepted = await postJson("/actions/run", {
        input: { action: action.action, inputObjectPaths: inputFileNames },
      });
      run.runId = accepted.runId;
      run.state = { status: accepted.status, progress: [], createdAtMs: accepted.createdAtMs };
      run.onUpdate?.(run);
      followRun(run);
    } catch (error) {
      run.requestError = error.message;
      run.clientEndedAt = Date.now();
      run.onUpdate?.(run);
    }
    renderRuns();
    if (run.id === selectedRunId) {
      renderDetails();
    }
    return run;
  }

  // Each event on the run's stream prompts a re-read of the run's state.
  // The terminal status is not an event: it arrives through the re-read
  // prompted by dobjd closing the stream once the run has finished.
  function followRun(run) {
    const runPath = `/actions/runs/${encodeURIComponent(run.runId)}`;
    let source = null;
    try {
      source = new EventSource(`${DOBJD_URL}${runPath}/events`);
    } catch (error) {
      console.warn("Could not open run events:", error);
    }
    run.eventSource = source;

    const readState = async () => {
      if (!isRunInProgress(run)) return;
      const previous = run.state;
      try {
        run.state = await fetchJson(runPath);
        run.transportError = null;
      } catch (error) {
        if (error.status !== 404) {
          run.transportError = error;
          run.onUpdate?.(run);
          return;
        }
        run.requestError = "dobjd no longer has this run.";
      }
      if (!isRunInProgress(run)) {
        run.clientEndedAt ??= Date.now();
        source?.close();
      }
      // Inputs become held and outputs appear (pending, then live) only at
      // a status change or a new progress step.
      if (run.state?.status !== previous?.status
        || run.state?.progress?.length !== previous?.progress?.length
        || !isRunInProgress(run)) {
        reloadObjects();
      }
      renderRuns();
      if (run.id === selectedRunId) {
        renderDetails();
      }
      run.onUpdate?.(run);
    };

    // One read at a time, so an older response never lands after a newer
    // one; a prompt that arrives mid-read is kept and served afterwards.
    let reading = false;
    let readQueued = false;
    const refresh = async () => {
      if (reading) {
        readQueued = true;
        return;
      }
      reading = true;
      try {
        do {
          readQueued = false;
          await readState();
        } while (readQueued);
      } finally {
        reading = false;
      }
    };
    if (source) {
      source.onmessage = refresh;
      source.onerror = refresh;
    }
    refresh();
  }

  // Uses dobjd's timestamps once it has reported them. The page's own clock
  // covers the moment before dobjd replies, and runs dobjd cannot report on.
  function elapsedText(run) {
    const startMs = run.state?.createdAtMs || run.clientStartedAt;
    const endMs = run.state?.finishedAtMs ?? run.clientEndedAt ?? Date.now();
    return formatDuration(Math.max(0, endMs - startMs));
  }

  // How long ago the run finished: "just now" within its first minute, then
  // whole minutes, hours or days.
  function finishedAgoText(run) {
    const endMs = run.state?.finishedAtMs ?? run.clientEndedAt ?? Date.now();
    const minutes = Math.floor(Math.max(0, Date.now() - endMs) / 60000);
    if (minutes < 1) {
      return "just now";
    }
    if (minutes < 60) {
      return `${minutes}m ago`;
    }
    const hours = Math.floor(minutes / 60);
    if (hours < 24) {
      return `${hours}h ago`;
    }
    return `${Math.floor(hours / 24)}d ago`;
  }

  // Rebuilds the job list from the runs dobjd still has in
  // progress, so a reload does not lose them. Runs that finished before the
  // page loaded are left out, as are runs this page already tracks.
  async function restoreRuns() {
    let retainedRuns;
    try {
      retainedRuns = await fetchJson("/actions/runs?status=active");
    } catch (error) {
      console.warn("Could not list runs:", error);
      return false;
    }
    for (const state of retainedRuns) {
      const alreadyTracked = runs.some((run) => run.runId === state.runId);
      if (state.action.pluginName !== PLUGIN_NAME || alreadyTracked) {
        continue;
      }
      const action = pluginActions.find(
        (candidate) => qualifiedClassName(candidate.action) === qualifiedClassName(state.action),
      ) ?? { action: state.action };
      const run = newRun(action, state.inputObjectPaths ?? []);
      run.runId = state.runId;
      run.state = state;
      runs.unshift(run);
      if (isRunInProgress(run)) {
        followRun(run);
      }
    }
    renderRuns();
    return true;
  }

  setInterval(() => {
    for (const run of runs) {
      if (run.finishedAgoElement?.isConnected) {
        run.finishedAgoElement.textContent = finishedAgoText(run);
      }
      if (!isRunInProgress(run)) {
        continue;
      }
      if (run.elapsedElement !== null) {
        run.elapsedElement.textContent = elapsedText(run);
      }
      if (run.id === selectedRunId && run.detailsElapsedElement?.isConnected) {
        run.detailsElapsedElement.textContent = elapsedText(run);
      }
      if (run.id === selectedRunId && run.latestEventDurationElement?.isConnected) {
        const latestEventIndex = (run.state?.progress ?? []).length - 1;
        run.latestEventDurationElement.textContent = eventDurationText(run, latestEventIndex);
      }
    }
  }, 1000);

  function renderRuns() {
    refreshOpenMenus();
    runList.replaceChildren();
    const visibleRuns = runs.filter((run) => run.showInJobs);
    document.getElementById("execute-pane").hidden = visibleRuns.length === 0;
    for (const run of visibleRuns) {
      const row = document.createElement("li");
      row.className = "run-row";
      row.classList.toggle("selected", run.id === selectedRunId);
      row.classList.toggle("in-progress", isRunInProgress(run));
      row.classList.toggle("failed", runStatus(run) === "failed");
      // As in the object list, a row flashes when the status it shows
      // changes, and a redraw mid-flash resumes the animation.
      const status = runStatus(run) ?? null;
      if (run.shownStatus !== undefined && run.shownStatus !== status) {
        run.flashStartedAt = Date.now();
      }
      run.shownStatus = status;
      const flashElapsed = Date.now() - (run.flashStartedAt ?? -Infinity);
      if (flashElapsed < ROW_FLASH_MS) {
        row.style.animation = `row-flash ${ROW_FLASH_MS}ms ease-out -${flashElapsed}ms`;
      }
      row.addEventListener("mousedown", (event) => {
        if (event.button !== 0 || (IS_MAC && event.ctrlKey)) {
          return;
        }
        const toggleKeyHeld = IS_MAC ? event.metaKey : event.ctrlKey;
        if (run.id === selectedRunId) {
          if (toggleKeyHeld) {
            selectedRunId = null;
            showSelection();
          }
          return;
        }
        selectedRunId = run.id;
        selectedFileNames.clear();
        anchorFileName = null;
        selectionAtAnchor = new Set();
        showSelection();
      });

      const iconSlot = document.createElement("span");
      iconSlot.className = "run-icon-slot";
      const icon = actionIcon(run.action.action.name, 0.5);
      if (icon) {
        iconSlot.append(icon);
      }

      const text = document.createElement("span");
      text.className = "run-text";
      const actionName = document.createElement("span");
      actionName.className = "action-name";
      actionName.textContent = qualifiedClassName(run.action.action);
      const runDetail = document.createElement("span");
      runDetail.className = "action-detail";
      run.elapsedElement = document.createElement("span");
      run.elapsedElement.textContent = elapsedText(run);
      runDetail.append(
        ` ${run.runId === null ? "Job" : `Job ${run.runId.slice(0, 4)}`} \u00b7 `,
        run.elapsedElement,
      );
      run.finishedAgoElement = null;
      if (status === "succeeded" || status === "failed") {
        run.finishedAgoElement = document.createElement("span");
        run.finishedAgoElement.textContent = finishedAgoText(run);
        runDetail.append(` \u00b7 ${status} `, run.finishedAgoElement);
      } else if (status) {
        runDetail.append(` \u00b7 ${status}`);
      }
      text.append(actionName, runDetail);
      row.append(iconSlot, text);
      runList.append(row);
    }
  }

  // Puts each signature argument on its own line; statements in the body are
  // already one per line. Anything not shaped like a single predicate
  // definition is shown unchanged.
  function formatPredicateSource(source) {
    const [signature, ...body] = source.split("\n");
    const match = /^(\w+)\((.*)\) = (AND|OR)\($/.exec(signature);
    if (match === null) {
      return source;
    }
    const [, predicateName, argumentList, connective] = match;
    const [publicArgs, privateArgs] = argumentList.split(/,?\s*private:\s*/);
    const argumentLines = publicArgs.split(", ").map((arg) => `  ${arg},`);
    if (privateArgs !== undefined) {
      argumentLines.push("private:");
      argumentLines.push(...privateArgs.split(", ").map((arg) => `  ${arg},`));
    }
    const lastArgument = argumentLines.length - 1;
    argumentLines[lastArgument] = argumentLines[lastArgument].replace(/,$/, "");
    return [`${predicateName}(`, ...argumentLines, `) = ${connective}(`, ...body].join("\n");
  }

  function subsection(titleText) {
    const title = document.createElement("div");
    title.className = "subsection-title";
    title.textContent = titleText;
    return title;
  }

  // Pairs each of the action's input slots, in order, with a selected object
  // of that slot's class, taking selected objects in selection order.
  function assignInputSlots(action, fileNames) {
    const unassigned = fileNames.map((fileName) => objectsByFileName.get(fileName));
    return action.totalInputs.map((input) => {
      const className = qualifiedClassName(input.class);
      const position = unassigned.findIndex((object) => qualifiedClassName(object.class) === className);
      return unassigned.splice(position, 1)[0];
    });
  }

  function subSubsection(titleText) {
    const title = document.createElement("div");
    title.className = "sub-subsection-title";
    title.textContent = titleText;
    return title;
  }

  // Each builder receives its "#N" label; an empty list renders "None".
  function numberedLines(lineBuilders) {
    const list = document.createElement("div");
    lineBuilders.forEach((buildLine, index) => list.append(buildLine(`#${index + 1}`)));
    if (lineBuilders.length === 0) {
      const none = document.createElement("div");
      none.className = "details-meta";
      none.textContent = "None";
      list.append(none);
    }
    return list;
  }

  // The Details pane's icon for an action: its graphic at 4x, or the blank
  // page when it has none.
  function largeActionIcon(actionName) {
    const icon = document.createElement("div");
    icon.className = "details-icon";
    icon.append(actionIcon(actionName, 4) ?? largeFileIconTemplate.content.cloneNode(true));
    return icon;
  }

  function renderActionInfo(action, container) {
    const icon = largeActionIcon(action.action.name);

    const title = document.createElement("div");
    title.className = "details-title action-name";
    title.textContent = qualifiedClassName(action.action);

    const meta = document.createElement("div");
    meta.className = "details-meta";
    meta.textContent = "executable action";

    const hashTable = document.createElement("table");
    hashTable.className = "field-table";
    appendFieldRow(hashTable, "hash", action.hash || null);

    const source = document.createElement("pre");
    source.className = "action-source";
    source.textContent = formatPredicateSource(action.predicateSource);

    const classLines = (slots) => numberedLines(slots.map((slot) => (prefix) => {
      const line = document.createElement("div");
      line.className = "details-meta";
      line.append(prefix, " \u00b7 ", classLabel(slot.class));
      return line;
    }));

    const mutatedObjects = action.mutatedObjects ?? [];
    const mutatedInputSlots = new Set(mutatedObjects.map((slots) => slots.inputIndex));
    const mutatedOutputSlots = new Set(mutatedObjects.map((slots) => slots.outputIndex));
    const consumedInputs = action.totalInputs.filter((_, slot) => !mutatedInputSlots.has(slot));
    const mutatedInputs = action.totalInputs.filter((_, slot) => mutatedInputSlots.has(slot));

    const inputs = document.createElement("div");
    inputs.className = "subsection-list";
    if (consumedInputs.length > 0) {
      inputs.append(subSubsection("Consumed"), classLines(consumedInputs));
    }
    if (mutatedInputs.length > 0) {
      inputs.append(subSubsection("Mutated"), classLines(mutatedInputs));
    }

    const newOutputs = action.totalOutputs.filter((_, slot) => !mutatedOutputSlots.has(slot));
    const outputs = document.createElement("div");
    outputs.className = "subsection-list";
    outputs.append(classLines(newOutputs));

    container.append(icon, title, meta, hashTable);
    if (action.totalInputs.length > 0) {
      container.append(subsection("Inputs"), inputs);
    }
    if (newOutputs.length > 0) {
      container.append(subsection("Outputs"), outputs);
    }
    const sourceSection = document.createElement("details");
    sourceSection.className = "collapsible-section";
    const sourceTitle = document.createElement("summary");
    sourceTitle.className = "subsection-title";
    sourceTitle.textContent = "Action Source";
    sourceSection.append(sourceTitle, source);
    container.append(sourceSection);
  }

  // Probes the synchronizer and relayer dobjd is configured to use. The page
  // reaches each service itself, at the address dobjd's settings name, so a
  // service that only dobjd could reach would show as disconnected here.
  async function refreshServiceStatus() {
    let settings = null;
    try {
      settings = await fetchJson("/settings");
    } catch (error) {
      console.warn("Could not read dobjd settings:", error);
    }
    await Promise.all([
      showServiceStatus("synchronizer", settings?.synchronizerApiUrl ?? null),
      showServiceStatus("relayer", settings?.relayerApiUrl ?? null),
    ]);
  }

  async function showServiceStatus(service, apiUrl) {
    const dot = document.getElementById(`${service}-dot`);
    const status = document.getElementById(`${service}-status`);
    const address = document.getElementById(`${service}-address`);
    address.textContent = apiUrl === null ? NOT_AVAILABLE : serviceAddress(apiUrl);
    address.title = apiUrl ?? "";
    let state = "unknown";
    if (apiUrl !== null) {
      try {
        const response = await fetch(`${apiUrl.replace(/\/$/, "")}/healthz`, {
          signal: AbortSignal.timeout(SERVICE_PROBE_TIMEOUT_MS),
        });
        state = response.ok ? "connected" : "disconnected";
      } catch {
        state = "disconnected";
      }
    }
    dot.classList.toggle("connected", state === "connected");
    dot.classList.toggle("disconnected", state === "disconnected");
    status.textContent = { connected: "Connected", disconnected: "Disconnected", unknown: "Unknown" }[state];
  }

  // The host and port of a service URL, or the URL itself if it is not one.
  function serviceAddress(apiUrl) {
    try {
      return new URL(apiUrl).host;
    } catch {
      return apiUrl;
    }
  }

  function showView(viewName) {
    currentViewName = viewName;
    for (const [name, { tab, view }] of Object.entries(views)) {
      tab.setAttribute("aria-selected", String(name === viewName));
      view.hidden = name !== viewName;
    }
    document.title = views[viewName].title;
    closeContextMenu();
    updateAddress();
  }

  function updateAddress() {
    const url = new URL(location.href);
    url.searchParams.delete(PAGE_PARAM);
    url.searchParams.delete(RECIPE_ACTION_PARAM);
    if (currentViewName === "recipebook") {
      url.searchParams.set(PAGE_PARAM, RECIPEBOOK_PAGE);
      if (selectedRecipeName !== null) {
        url.searchParams.set(RECIPE_ACTION_PARAM, selectedRecipeName);
      }
    }
    history.replaceState(null, "", url);
  }

  function showRecipes(actions) {
    recipeActions = actions;
    renderRecipeList();
    if (initialParams.get(PAGE_PARAM) !== RECIPEBOOK_PAGE) {
      return;
    }
    const linkedName = initialParams.get(RECIPE_ACTION_PARAM);
    const linkedRow = recipeRowsByName.get(linkedName);
    if (linkedRow !== undefined) {
      selectRecipe(linkedName);
      linkedRow.scrollIntoView({ block: "center" });
    }
  }

  function renderRecipeList() {
    recipeList.replaceChildren();
    recipeRowsByName.clear();
    for (const action of recipeActions) {
      const actionName = qualifiedClassName(action.action);
      const row = document.createElement("li");
      row.className = "recipe-row";
      row.classList.toggle("selected", actionName === selectedRecipeName);
      row.addEventListener("mousedown", (event) => {
        if (event.button !== 0 || (IS_MAC && event.ctrlKey)) {
          return;
        }
        const toggleKeyHeld = IS_MAC ? event.metaKey : event.ctrlKey;
        if (actionName === selectedRecipeName && !toggleKeyHeld) {
          return;
        }
        selectRecipe(actionName === selectedRecipeName ? null : actionName);
      });

      const iconSlot = document.createElement("span");
      iconSlot.className = "recipe-icon-slot";
      const icon = actionIcon(action.action.name, 1);
      if (icon) {
        iconSlot.append(icon);
      }

      const name = document.createElement("div");
      name.className = "action-name";
      name.textContent = actionName;

      const path = document.createElement("div");
      path.className = "action-detail recipe-path";
      path.title = action.sourcePath ?? "";
      // Marks keep the leading "/" in place under right-to-left layout.
      path.textContent = `\u200e${action.sourcePath || NOT_AVAILABLE}\u200e`;

      const text = document.createElement("div");
      text.className = "row-text";
      text.append(name, path);
      row.append(iconSlot, text);
      recipeRowsByName.set(actionName, row);
      recipeList.append(row);
    }
  }

  function selectRecipe(actionName) {
    selectedRecipeName = actionName;
    for (const [rowName, row] of recipeRowsByName) {
      row.classList.toggle("selected", rowName === selectedRecipeName);
    }
    updateAddress();
    renderRecipeDetails();
  }

  function renderRecipeDetails() {
    recipeDetailsBody.replaceChildren();
    const action = recipeActions.find(
      (candidate) => qualifiedClassName(candidate.action) === selectedRecipeName,
    );
    if (action === undefined) {
      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Select an action to view details.";
      recipeDetailsBody.append(message);
      return;
    }
    renderActionInfo(action, recipeDetailsBody);
  }

  function formatDuration(milliseconds) {
    return `${Math.floor(milliseconds / 1000)}s`;
  }

  // How long the run spent at an event: until the next event, or, for the
  // latest event, until the run finished (until now while it is running).
  function eventDurationText(run, eventIndex) {
    const events = run.state?.progress ?? [];
    const startMs = events[eventIndex]?.atMs;
    const nextEvent = events[eventIndex + 1];
    const endMs = nextEvent
      ? nextEvent.atMs
      : run.state?.finishedAtMs ?? run.clientEndedAt ?? Date.now();
    if (!startMs || !endMs) {
      return NOT_AVAILABLE;
    }
    return formatDuration(Math.max(0, endMs - startMs));
  }

  function runStatus(run) {
    return run.requestError !== null ? "failed" : run.state?.status;
  }

  function formatTimestamp(milliseconds) {
    return milliseconds ? new Date(milliseconds).toLocaleString() : null;
  }

  // Spent inputs move into the hidden `.nullified/` folder once the run has
  // succeeded and its nullifiers are on-chain.
  function inputFilePath(run, fileName) {
    const spent = run.state?.status === "succeeded"
      && (run.state.result?.nullifiedFiles ?? []).includes(fileName);
    return `${objectsDirPath}/${spent ? ".nullified/" : ""}${fileName}`;
  }

  // The result names the outputs once the run succeeds; before that, the
  // commit phase's progress events report them as they are written.
  function runOutputFiles(run) {
    if (run.state?.result) {
      return run.state.result.outputFiles;
    }
    const withOutputs = (run.state?.progress ?? []).filter((event) => event.outputFiles);
    return withOutputs.at(-1)?.outputFiles ?? [];
  }

  function pathList(paths) {
    const list = document.createElement("div");
    list.className = "subsection-list";
    paths.forEach((path, index) => {
      const line = document.createElement("div");
      line.className = "path-line";
      const label = document.createElement("span");
      label.className = "path-label";
      label.textContent = `#${index + 1}`;
      line.append(label, path);
      list.append(line);
    });
    if (paths.length === 0) {
      const none = document.createElement("div");
      none.className = "details-meta";
      none.textContent = "None";
      list.append(none);
    }
    return list;
  }

  function renderRunDetails(run) {
    const icon = largeActionIcon(run.action.action.name);

    const title = document.createElement("div");
    title.className = "details-title";
    title.textContent = run.runId === null ? "Job" : `Job ${run.runId}`;

    const meta = document.createElement("div");
    meta.className = "details-meta";
    meta.textContent = [qualifiedClassName(run.action.action), runStatus(run)]
      .filter((part) => part)
      .join(" \u00b7 ");

    const properties = document.createElement("table");
    properties.className = "field-table";
    appendFieldRow(
      properties,
      "started",
      formatTimestamp(run.state?.createdAtMs || run.clientStartedAt),
    );
    run.detailsElapsedElement = appendFieldRow(properties, "duration", elapsedText(run));
    const result = run.state?.result;
    if (result) {
      appendFieldRow(properties, "old root", result.oldRoot);
      appendFieldRow(properties, "new root", result.newRoot);
    }
    const error = run.requestError ?? run.state?.error;
    if (error) {
      appendFieldRow(properties, "error", error);
    }

    const inputFileNames = run.state?.inputObjectPaths ?? run.inputFileNames;
    const inputs = pathList(inputFileNames.map((fileName) => inputFilePath(run, fileName)));
    const outputs = pathList(
      runOutputFiles(run).map((fileName) => `${objectsDirPath}/${fileName}`),
    );

    const log = document.createElement("table");
    log.className = "field-table run-log";
    const events = run.state?.progress ?? [];
    run.latestEventDurationElement = null;
    for (let eventIndex = events.length - 1; eventIndex >= 0; eventIndex--) {
      const event = events[eventIndex];
      const row = log.insertRow();
      const cells = [
        formatTimestamp(event.atMs) ?? NOT_AVAILABLE,
        eventDurationText(run, eventIndex),
        event.phase,
        event.status,
        event.message,
      ].map((text) => {
        const cell = row.insertCell();
        cell.textContent = text;
        return cell;
      });
      if (eventIndex === events.length - 1) {
        run.latestEventDurationElement = cells[1];
      }
    }
    if (events.length === 0) {
      log.insertRow().insertCell().textContent = "None";
    }

    detailsBody.append(
      icon,
      title,
      meta,
      properties,
      subsection("Inputs"),
      inputs,
      subsection("Outputs"),
      outputs,
      subsection("Log"),
      log,
    );
  }

  function renderDetails() {
    detailsBody.replaceChildren();
    const selectedRun = runs.find((run) => run.id === selectedRunId);
    if (selectedRun !== undefined) {
      renderRunDetails(selectedRun);
      return;
    }
    if (selectedFileNames.size === 1 && selectedFileNames.has(WELCOME_FILE)) {
      const guide = document.createElement("div");
      guide.className = "markdown-body";
      guide.append(...renderMarkdown(welcomeText));
      detailsBody.append(guide);
      return;
    }
    if (selectedFileNames.size === 0) {
      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Select an item to view details.";
      detailsBody.append(message);
      return;
    }
    if (selectedFileNames.size > 1) {
      renderMultipleDetails();
      return;
    }

    const [fileName] = selectedFileNames;
    const object = objectsByFileName.get(fileName);

    const icon = document.createElement("div");
    icon.className = "details-icon";
    const page = document.createElement("div");
    page.className = "large-page-icon";
    page.append(largeFileIconTemplate.content.cloneNode(true));
    const classIconPath = classIconPaths[object.class.name];
    if (classIconPath) {
      const classIcon = document.createElement("img");
      classIcon.className = "large-class-icon";
      classIcon.src = classIconPath;
      classIcon.alt = "";
      page.append(classIcon);
    }
    icon.append(page);

    const title = document.createElement("div");
    title.className = "details-title";
    title.textContent = object.fileName;

    const meta = summaryLine(object, []);

    const identityTable = document.createElement("table");
    identityTable.className = "field-table";
    appendFieldRow(identityTable, "stable_identifier", fieldValue(object, "stable_identifier"));
    appendFieldRow(identityTable, "contentHash", object.contentHash);
    appendFieldRow(identityTable, "classHash", object.classHash || null);

    const key = fieldValue(object, "key");
    const keyCell = appendFieldRow(identityTable, "key", key);
    if (key !== null) {
      let keyRevealed = false;
      keyCell.textContent = HIDDEN_KEY_TEXT;
      keyCell.className = "hidden-value";
      keyCell.addEventListener("click", () => {
        keyRevealed = !keyRevealed;
        keyCell.textContent = keyRevealed ? key : HIDDEN_KEY_TEXT;
      });
    }

    const propertiesTitle = subsection("Properties");

    const propertiesTable = document.createElement("table");
    propertiesTable.className = "field-table";
    for (const [name, value] of fieldEntries(object)) {
      if (!NON_PROPERTY_KEYS.has(name)) {
        appendFieldRow(propertiesTable, name, displayValue(value));
      }
    }

    detailsBody.append(icon, title, meta, identityTable, propertiesTitle, propertiesTable);
  }

  // An error with `noResponse` set got no HTTP response from dobjd at all.
  async function fetchJson(path, options) {
    let response;
    try {
      response = await fetch(DOBJD_URL + path, options);
    } catch (error) {
      error.noResponse = true;
      throw error;
    }
    if (!response.ok) {
      const error = new Error(`${path}: HTTP ${response.status}`);
      error.status = response.status;
      throw error;
    }
    return response.json();
  }

  function postJson(path, body) {
    return fetchJson(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  function showMessage(text, isError) {
    objectList.replaceChildren();
    const item = document.createElement("li");
    item.className = isError ? "message error" : "message";
    item.textContent = text;
    objectList.append(item);
  }

  // Splits a file name so that, when it overflows, only the head is cut
  // short and the tail stays visible: the extension plus the characters
  // just before it, as Finder truncates.
  function splitForMiddleTruncation(fileName) {
    const charactersBeforeExtension = 8;
    const extensionStart = fileName.lastIndexOf(".");
    const tailStart = Math.max(
      0,
      (extensionStart > 0 ? extensionStart : fileName.length) - charactersBeforeExtension,
    );
    return [fileName.slice(0, tailStart), fileName.slice(tailStart)];
  }

  const nameMeasureContext = document.createElement("canvas").getContext("2d");

  function renderObjects(objects) {
    objectList.replaceChildren();
    rowsByFileName.clear();
    if (welcomeText !== null) {
      appendFileRow(WELCOME_FILE, docIconTemplate.content.cloneNode(true));
    }
    for (const object of objects) {
      const row = appendFileRow(object.fileName, smallClassIcon(object.class.name));
      const state = shownState(object);
      row.classList.toggle("unknown", state === "unknown");
      row.classList.toggle("pending", state === "pending");
      row.classList.toggle("held", state === "held");
      const flashElapsed = Date.now() - (flashStartedAt.get(object.fileName) ?? -Infinity);
      if (flashElapsed < ROW_FLASH_MS) {
        // A redraw mid-flash resumes the animation rather than restarting it.
        row.classList.add("flashing");
        row.style.animation = `row-flash ${ROW_FLASH_MS}ms ease-out -${flashElapsed}ms`;
      }
    }
    fitObjectNames();
  }

  function appendFileRow(fileName, icon) {
    const row = document.createElement("li");
    row.className = "object-row";
    row.title = fileName;
    row.classList.toggle("selected", selectedFileNames.has(fileName));
    const name = document.createElement("span");
    name.className = "object-name";
    row.append(icon, name);

    // A ctrl-click on macOS is a context-menu click and leaves the
    // selection alone.
    row.addEventListener("mousedown", (event) => {
      if (event.button === 0 && !(IS_MAC && event.ctrlKey)) {
        selectWithClick(fileName, event);
      }
    });
    row.addEventListener("dblclick", () => {
      window.open(fileUrl(fileName), "_blank", "noopener");
    });
    // As in Finder, a right-click on an unselected row selects only that
    // row; on a selected row it keeps the whole selection.
    row.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (!selectedFileNames.has(fileName)) {
        selectWithClick(fileName, { shiftKey: false, metaKey: false, ctrlKey: false });
      }
      showObjectMenu(event.clientX, event.clientY);
    });
    rowsByFileName.set(fileName, row);
    objectList.append(row);
    return row;
  }

  // The file names in the object list, in list order.
  function listedFileNames() {
    const objectFileNames = [...objectsByFileName.keys()];
    return welcomeText === null ? objectFileNames : [WELCOME_FILE, ...objectFileNames];
  }

  function isListedFile(fileName) {
    return objectsByFileName.has(fileName) || (fileName === WELCOME_FILE && welcomeText !== null);
  }

  // Where Open and View raw take a listed file.
  function fileUrl(fileName) {
    return fileName === WELCOME_FILE ? WELCOME_FILE : rawObjectUrl(fileName);
  }

  // Renders the Markdown subset the welcome guide uses: headings,
  // paragraphs, bulleted and numbered lists, pipe tables, and inline bold and
  // code. Anything else shows as plain text.
  function renderMarkdown(source) {
    const lines = source.split("\n");
    const blocks = [];
    const listItemPattern = /^(?:[-*]|\d+\.) (.*)$/;
    const startsBlock = (line) => /^(?:#{1,6} |[-*] |\d+\. |\|)/.test(line);
    let index = 0;
    while (index < lines.length) {
      const line = lines[index];
      if (line.trim() === "") {
        index++;
        continue;
      }
      const heading = /^(#{1,6}) (.*)$/.exec(line);
      if (heading !== null) {
        const element = document.createElement(`h${heading[1].length}`);
        element.append(...renderInlineMarkdown(heading[2]));
        blocks.push(element);
        index++;
        continue;
      }
      if (listItemPattern.test(line)) {
        const list = document.createElement(/^\d/.test(line) ? "ol" : "ul");
        let item;
        while (index < lines.length && (item = listItemPattern.exec(lines[index])) !== null) {
          const listItem = document.createElement("li");
          listItem.append(...renderInlineMarkdown(item[1]));
          list.append(listItem);
          index++;
        }
        blocks.push(list);
        continue;
      }
      if (line.startsWith("|")) {
        const rows = [];
        while (index < lines.length && lines[index].startsWith("|")) {
          rows.push(lines[index].trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim()));
          index++;
        }
        const hasHeader = rows.length > 1 && rows[1].every((cell) => /^:?-+:?$/.test(cell));
        const table = document.createElement("table");
        rows.forEach((cells, rowIndex) => {
          if (hasHeader && rowIndex === 1) {
            return;
          }
          const row = table.insertRow();
          for (const cell of cells) {
