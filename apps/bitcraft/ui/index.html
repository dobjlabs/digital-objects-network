            const element = document.createElement(hasHeader && rowIndex === 0 ? "th" : "td");
            element.append(...renderInlineMarkdown(cell));
            row.append(element);
          }
        });
        blocks.push(table);
        continue;
      }
      const paragraphLines = [];
      while (index < lines.length && lines[index].trim() !== "" && !startsBlock(lines[index])) {
        paragraphLines.push(lines[index].trim());
        index++;
      }
      const paragraph = document.createElement("p");
      paragraph.append(...renderInlineMarkdown(paragraphLines.join(" ")));
      blocks.push(paragraph);
    }
    return blocks;
  }

  function renderInlineMarkdown(text) {
    const nodes = [];
    const pattern = /`([^`]+)`|\*\*(.+?)\*\*/g;
    let plainStart = 0;
    let match;
    while ((match = pattern.exec(text)) !== null) {
      nodes.push(text.slice(plainStart, match.index));
      const element = document.createElement(match[1] !== undefined ? "code" : "strong");
      element.textContent = match[1] ?? match[2];
      nodes.push(element);
      plainStart = pattern.lastIndex;
    }
    nodes.push(text.slice(plainStart));
    return nodes;
  }

  // Writes each row's file name, cut in the middle to fit its row.
  function fitObjectNames() {
    const firstName = objectList.querySelector(".object-name");
    if (firstName === null) {
      return;
    }
    nameMeasureContext.font = getComputedStyle(firstName).font;
    for (const [fileName, row] of rowsByFileName) {
      const name = row.querySelector(".object-name");
      name.textContent = fitFileName(fileName, name.clientWidth);
    }
  }

  // The longest form of the name that fits `availableWidth`: the whole name,
  // or as much of its head as fits ahead of an ellipsis and its tail.
  function fitFileName(fileName, availableWidth) {
    const measure = (text) => nameMeasureContext.measureText(text).width;
    if (measure(fileName) <= availableWidth) {
      return fileName;
    }
    const [head, tail] = splitForMiddleTruncation(fileName);
    const shortened = (headLength) => `${head.slice(0, headLength)}\u2026${tail}`;
    let fittingHeadLength = 0;
    let tooLongHeadLength = head.length;
    while (tooLongHeadLength - fittingHeadLength > 1) {
      const middle = Math.floor((fittingHeadLength + tooLongHeadLength) / 2);
      if (measure(shortened(middle)) <= availableWidth) {
        fittingHeadLength = middle;
      } else {
        tooLongHeadLength = middle;
      }
    }
    return shortened(fittingHeadLength);
  }

  function selectWithClick(fileName, event) {
    // A selected job is always the only selection.
    selectedRunId = null;
    const toggleKeyHeld = IS_MAC ? event.metaKey : event.ctrlKey;
    if (event.shiftKey && selectedFileNames.size > 0 && anchorFileName !== null) {
      const fileNames = listedFileNames();
      const anchorIndex = fileNames.indexOf(anchorFileName);
      const clickedIndex = fileNames.indexOf(fileName);
      const start = Math.min(anchorIndex, clickedIndex);
      const end = Math.max(anchorIndex, clickedIndex);
      selectedFileNames.clear();
      for (const keptFileName of selectionAtAnchor) {
        selectedFileNames.add(keptFileName);
      }
      for (const rangeFileName of fileNames.slice(start, end + 1)) {
        selectedFileNames.add(rangeFileName);
      }
    } else if (toggleKeyHeld) {
      if (selectedFileNames.has(fileName)) {
        selectedFileNames.delete(fileName);
      } else {
        selectedFileNames.add(fileName);
      }
      anchorFileName = fileName;
      selectionAtAnchor = new Set(selectedFileNames);
    } else {
      if (selectedFileNames.size === 1 && selectedFileNames.has(fileName)) {
        return;
      }
      selectedFileNames.clear();
      selectedFileNames.add(fileName);
      anchorFileName = fileName;
      selectionAtAnchor = new Set(selectedFileNames);
    }
    showSelection();
  }

  function clearSelection() {
    selectedFileNames.clear();
    anchorFileName = null;
    selectionAtAnchor = new Set();
    selectedRunId = null;
    showSelection();
  }

  function showSelection() {
    for (const [rowFileName, row] of rowsByFileName) {
      row.classList.toggle("selected", selectedFileNames.has(rowFileName));
    }
    renderRuns();
    renderDetails();
  }

  async function load() {
    stopStartupPocketknife();
    setStartupProgress(0);
    showStartup("Opening Bitcraft...", "Getting your inventory ready.");
    showMessage("Loading...", false);
    try {
      const [objectsDir, objects, actions, iconPaths, actionIcons, welcome] = await Promise.all([
        fetchJson("/objects/dir"),
        fetchJson("/objects/unspent"),
        fetchJson("/actions"),
        loadUiDataFile(CLASS_ICONS_URL, {}),
        loadUiDataFile(ACTION_ICONS_URL, { rules: [] }),
        loadUiTextFile(WELCOME_FILE),
      ]);
      setStartupProgress(1);
      welcomeText = welcome;
      welcomeFileSize = welcome === null ? null : new TextEncoder().encode(welcome).length;
      classIconPaths = iconPaths;
      actionIconRules = actionIcons.rules;
      pluginActions = actions.filter((action) => action.action.pluginName === PLUGIN_NAME);
      objectsDirPath = objectsDir.path;
      objectsDirHeader.textContent = objectsDir.path;
      objectsDirHeader.title = objectsDir.path;
      showObjects(objects);
      showRecipes(pluginActions);
      if (!await restoreRuns()) throw new Error("Could not check active jobs. Please try again.");
      await ensureStartupPocketknife();
    } catch (error) {
      showStartupError(startupErrorText(error));
    }
  }

  function setStartupProgress(completed) {
    const progress = document.getElementById("startup-progress");
    progress.value = completed;
    updateStartupProgressLabel();
  }

  function updateStartupProgressLabel() {
    const progress = document.getElementById("startup-progress");
    const label = `Step ${Math.min(progress.value + 1, progress.max)} of ${progress.max}`;
    progress.setAttribute("aria-valuetext", `${label}: ${document.getElementById("startup-status").textContent}`);
    document.getElementById("startup-progress-label").textContent = label;
  }

  function showStartup(title, description) {
    document.getElementById("startup-screen").hidden = false;
    document.getElementById("inventory-app").hidden = true;
    document.getElementById("inventory-app").inert = true;
    const status = document.getElementById("startup-status");
    const detail = document.getElementById("startup-description");
    if (status.textContent !== title) {
      status.textContent = title;
      document.getElementById("startup-copy-status").hidden = true;
    }
    if (detail.textContent !== description) detail.textContent = description;
    updateStartupProgressLabel();
    document.getElementById("startup-error").hidden = true;
    document.getElementById("startup-actions").hidden = true;
  }

  function showStartupError(message) {
    showStartup("Bitcraft could not finish setup", "Your inventory opens once you have a starter pocketknife. Try again to continue.");
    const error = document.getElementById("startup-error");
    if (error.textContent !== message) {
      error.textContent = message;
      document.getElementById("startup-copy-status").hidden = true;
    }
    error.hidden = false;
    document.getElementById("startup-actions").hidden = false;
  }

  function finishStartup() {
    document.getElementById("startup-screen").hidden = true;
    document.getElementById("inventory-app").hidden = false;
    document.getElementById("inventory-app").inert = false;
    fitObjectNames();
  }

  document.getElementById("startup-retry").addEventListener("click", load);
  document.getElementById("startup-copy").addEventListener("click", async () => {
    const error = document.getElementById("startup-error");
    const message = error.textContent;
    let feedback;
    try {
      await navigator.clipboard.writeText(message);
      feedback = "Error copied.";
    } catch {
      feedback = "Could not copy. Select the error text and copy it.";
    }
    if (error.hidden || error.textContent !== message) return;
    const status = document.getElementById("startup-copy-status");
    status.textContent = feedback;
    status.hidden = false;
  });

  // Reads a JSON file served next to this page, not by dobjd, or returns
  // `fallback` if it cannot be read.
  async function loadUiDataFile(url, fallback) {
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.warn(`Could not load ${url}:`, error);
      return fallback;
    }
  }

  // Reads a text file served next to this page, or returns null if it
  // cannot be read.
  async function loadUiTextFile(url) {
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return await response.text();
    } catch (error) {
      console.warn(`Could not load ${url}:`, error);
      return null;
    }
  }

  // Keeps the current list on failure; the next completed run retries.
  async function reloadObjects() {
    if (objectReloadInFlight) {
      objectReloadQueued = true;
      return;
    }
    objectReloadInFlight = true;
    try {
      showObjects(await fetchJson("/objects/unspent"));
    } catch (error) {
      console.warn("Could not reload objects:", error);
      if (!document.getElementById("startup-screen").hidden) {
        showStartupError(`Could not refresh inventory: ${error.message}`);
      }
    } finally {
      objectReloadInFlight = false;
      if (objectReloadQueued) {
        objectReloadQueued = false;
        reloadObjects();
      }
    }
  }

  // The state a row's colour shows. `pending` takes precedence over being
  // held by a run, which takes precedence over the remaining statuses.
  function shownState(object) {
    if (object.status === "pending") {
      return "pending";
    }
    return object.heldByRunId != null ? "held" : object.status;
  }

  // Pending objects are left out of every count and value until they are
  // confirmed.
  function isLive(object) {
    return object.status === "live";
  }

  function liveListedObjects() {
    return [...objectsByFileName.values()].filter(isLive);
  }

  function formatBitValue(value) {
    return Number.isInteger(value) ? String(value) : value.toFixed(1);
  }

  // An object whose class has no value listed is worth nothing.
  function totalBitValue(object) {
    const className = object.class.name;
    const valuesByLevel = LEVELED_TOTAL_BIT_VALUES[className];
    if (valuesByLevel !== undefined) {
      return valuesByLevel[Number(fieldValue(object, "level")) - 1] ?? 0;
    }
    const contentValue = BUCKET_CONTENT_BIT_VALUES[className] ?? 0;
    return (TOTAL_BIT_VALUES[className] ?? 0) + contentValue * Number(fieldValue(object, "n") ?? 0);
  }

  function updateObjectsFooter() {
    const totalValue = liveListedObjects().reduce((sum, object) => sum + totalBitValue(object), 0);
    // The guide is listed as a file alongside the objects.
    const fileCount = objectFileCount + (welcomeText === null ? 0 : 1);
    const noun = fileCount === 1 ? "file" : "files";
    objectsFooter.textContent =
      `${fileCount} ${noun} \u00b7 Total Bit Value: ${formatBitValue(totalValue)}`;
  }

  // Replaces the object list, keeping the selection of any objects that are
  // still held and dropping the rest. A row flashes when its file is new to
  // the page or its shown state changed; nothing flashes on the first load,
  // or for changes made while the setup screen covers the list.
  function showObjects(objects) {
    objectFileCount = objects.length;
    const heldObjects = objects
      .filter((object) => object.class.pluginName === PLUGIN_NAME)
      .sort((left, right) => left.fileName.localeCompare(right.fileName));
    const now = Date.now();
    const listVisible = document.getElementById("startup-screen").hidden;
    for (const object of heldObjects) {
      const state = shownState(object);
      if (listVisible && lastShownStates !== null && lastShownStates.get(object.fileName) !== state) {
        flashStartedAt.set(object.fileName, now);
      }
    }
    lastShownStates ??= new Map();
    for (const object of heldObjects) {
      lastShownStates.set(object.fileName, shownState(object));
    }
    objectsByFileName.clear();
    for (const object of heldObjects) {
      objectsByFileName.set(object.fileName, object);
    }
    updateObjectsFooter();
    for (const fileName of [...selectedFileNames]) {
      if (!isListedFile(fileName)) {
        selectedFileNames.delete(fileName);
      }
    }
    selectionAtAnchor = new Set(
      [...selectionAtAnchor].filter(isListedFile),
    );
    if (anchorFileName !== null && !isListedFile(anchorFileName)) {
      anchorFileName = null;
    }
    if (menuFileNames.some((fileName) => !isListedFile(fileName))) {
      closeContextMenu();
    }

    renderObjects(heldObjects);
    // With the guide listed, an inventory with no objects still shows a file.
    if (heldObjects.length === 0 && welcomeText === null) {
      const message = document.createElement("li");
      message.className = "message";
      message.textContent = "No objects.";
      objectList.append(message);
    }
    showSelection();
    updateStartupPocketknife();
  }

  function isPlainPress(event) {
    return event.button === 0
      && !event.shiftKey && !event.metaKey && !event.ctrlKey && !event.altKey;
  }

  objectList.addEventListener("mousedown", (event) => {
    if (event.target === objectList && isPlainPress(event)) {
      clearSelection();
    }
  });

  // A right-click on empty space clears the selection, so the menu offers
  // the actions that take no inputs.
  objectList.addEventListener("contextmenu", (event) => {
    if (event.target.closest(".object-row") !== null) {
      return;
    }
    event.preventDefault();
    clearSelection();
    showObjectMenu(event.clientX, event.clientY);
  });

  runList.addEventListener("mousedown", (event) => {
    if (event.target === runList && isPlainPress(event)) {
      clearSelection();
    }
  });

  const isInsideMenu = (target) => openMenu?.contains(target) ?? false;
  document.addEventListener("mousedown", (event) => {
    if (!isInsideMenu(event.target)) {
      closeContextMenu();
    }
  }, true);
  document.addEventListener("scroll", (event) => {
    if (!isInsideMenu(event.target)) {
      closeContextMenu();
    }
  }, true);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeContextMenu();
    }
  });
  window.addEventListener("blur", closeContextMenu);
  window.addEventListener("resize", closeContextMenu);

  new ResizeObserver(() => fitObjectNames()).observe(objectList);

  recipeList.addEventListener("mousedown", (event) => {
    if (event.target === recipeList && isPlainPress(event) && selectedRecipeName !== null) {
      selectRecipe(null);
    }
  });

  for (const [name, { tab }] of Object.entries(views)) {
    tab.addEventListener("click", () => showView(name));
  }

  document.getElementById("bitcraft-version").textContent = BITCRAFT_VERSION;
  refreshServiceStatus();
  setInterval(refreshServiceStatus, SERVICE_STATUS_INTERVAL_MS);

  showView(initialParams.get(PAGE_PARAM) === RECIPEBOOK_PAGE ? "recipebook" : "objects");
  renderDetails();
  renderRecipeDetails();
  load();
</script>
</body>
</html>
