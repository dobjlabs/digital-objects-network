# A receipt-free recipe: every slot is spliced from craft-basics rekeys,
# so this plugin declares no classes of its own (`classes = []`) and its
# action compiles without an io record. Three re-keyed survivors plus the
# chain overhead land exactly on pod2's 8-wildcard predicate budget --
# there is no room for a receipt here, which is why none is minted.
classes = []

[plugin]
name = "swap-log-sticks"
version = "0.1.0"
module_hash = "cb4f2e337f85a82c903a9ce4be9ac9fac0687194f1e6e36d522ec677245e2fce"

[[actions]]
name = "SwapLogSticks"
emoji = "🤝"
description = "Re-key one log against two sticks in a single transaction."
