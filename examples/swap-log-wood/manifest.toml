# A plugin whose script composes another plugin's actions.
#
# There is nothing here about the dependency: the script's qualified
# `subaction("craft-basics::RekeyLog")` calls declare it by using it, and the
# catalog loads craft-basics first so its compiled batch is available. The
# module_hash below covers that import, so it moves whenever craft-basics does.

[plugin]
name = "swap-log-wood"
version = "0.1.0"
# Rewritten by `cargo run -p pexe -- build examples/swap-log-wood`.
module_hash = "73666676f7531778615b77172f281f2f7a400f4e7feeb3102d1468c367826f00"

[[classes]]
name = "Swapped"
emoji = "🧾"
description = "A receipt minted by a swap, stamped with the grounding block's timestamp."

[[actions]]
name = "SwapLogWood"
emoji = "🤝"
description = "Re-key one log and one wood together and mint a receipt, in a single transaction."
